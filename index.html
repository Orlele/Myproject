
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORLY — a little space for everything that matters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
<style>
/* ============ 1. DESIGN TOKENS ============ */
:root{
  --pink:#EC4899; --pink-soft:#F9A8D4; --pink-deep:#DB2777;
  --purple:#8B5CF6; --purple-deep:#6D28D9; --purple-dark:#2E1065;
  --bg:#FDF4FF; --white:#fff;
  --text:#2E1065; --muted:#6b5a8c;
  --glass:rgba(255,255,255,.62); --glass-line:rgba(139,92,246,.18);
  --shadow:0 10px 30px -12px rgba(109,40,217,.25);
  --glow:0 18px 44px -10px rgba(236,72,153,.4);
  --grad:linear-gradient(135deg,var(--pink),var(--purple));
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --serif:'Fraunces',Georgia,serif;
  --r:22px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#11091F; --text:#F5E9FF; --muted:#b9a6d9;
  --glass:rgba(46,16,101,.38); --glass-line:rgba(249,168,212,.16);
  --shadow:0 12px 34px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
/* ============ 2. BASE ============ */
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.65;overflow-x:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:background .4s,color .4s}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px;border-radius:8px}
section{padding:96px 0;position:relative}
.wrap{width:min(1120px,100% - 40px);margin-inline:auto}
h2{font-size:clamp(1.9rem,4vw,2.8rem);line-height:1.12;letter-spacing:-.02em;margin-bottom:12px}
h2 em,.serif{font-family:var(--serif);font-weight:400}
.lead{color:var(--muted);max-width:52ch;margin-bottom:40px}
.glass{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-line);border-radius:var(--r);box-shadow:var(--shadow)}
.star{color:var(--pink)}
/* ============ 3. BUTTONS ============ */
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:999px;border:1px solid transparent;font-weight:600;transition:transform .25s,box-shadow .25s,background .25s}
.btn-primary{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 22px 48px -10px rgba(236,72,153,.55)}
.btn-ghost{background:var(--glass);border-color:var(--glass-line)}
.btn-ghost:hover{transform:translateY(-2px);border-color:var(--pink)}
/* ============ 4. NAVIGATION ============ */
header{position:fixed;inset:0 0 auto;z-index:50;padding:calc(12px + env(safe-area-inset-top,0px)) 0 0}
.nav{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 10px 24px;border-radius:999px}
.logo{font-weight:800;letter-spacing:.14em;font-size:1.15rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.links{display:flex;gap:4px;list-style:none;padding:0}
.links a{position:relative;display:block;padding:8px 14px;font-size:.92rem;font-weight:500;color:var(--muted);transition:color .2s}
.links a::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:2px;border-radius:2px;background:var(--grad);transform:scaleX(0);transition:transform .3s;box-shadow:0 0 10px var(--pink)}
.links a:hover,.links a.active{color:var(--text)}
.links a.active::after,.links a:hover::after{transform:scaleX(1)}
.tools{display:flex;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass);display:grid;place-items:center;transition:transform .25s,border-color .25s}
.icon-btn:hover{transform:rotate(12deg);border-color:var(--pink)}
.icon-btn svg{width:18px;height:18px}
.burger{display:none}
.moon{display:none}[data-theme="dark"] .moon{display:block}[data-theme="dark"] .sun{display:none}
@media(max-width:820px){
  .burger{display:grid}
  .links{position:absolute;top:calc(100% + 10px);left:0;right:0;flex-direction:column;padding:12px;border-radius:var(--r);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--glass-line);
    opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;transition:.28s}
  .links.open{opacity:1;transform:none;pointer-events:auto}
  .links a{padding:12px 16px}.links a::after{display:none}
  .links a.active{background:rgba(236,72,153,.12);border-radius:12px}
  .nav-wrap{position:relative}
}
/* ============ 5. HERO ============ */
.hero{min-height:100svh;display:grid;align-items:center;padding-top:130px;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
.orb.a{width:520px;height:520px;right:-120px;top:6%;background:radial-gradient(circle at 30% 30%,var(--pink),var(--purple) 70%);opacity:.5;animation:drift 14s ease-in-out infinite alternate}
.orb.b{width:340px;height:340px;left:-100px;bottom:4%;background:var(--pink-soft);opacity:.45;animation:drift 18s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(-40px,30px) scale(1.08)}}
.float{position:absolute;color:var(--pink);opacity:.55;animation:bob 6s ease-in-out infinite;pointer-events:none}
.float:nth-of-type(3){color:var(--purple);animation-delay:-2s}
.float:nth-of-type(4){animation-delay:-4s}
@keyframes bob{50%{transform:translateY(-16px) rotate(20deg)}}
.hero-inner{position:relative;z-index:2}
.hero h1{font-size:clamp(5rem,19vw,13rem);font-weight:800;letter-spacing:-.05em;line-height:.88;
  background:linear-gradient(120deg,var(--pink-deep),var(--purple) 55%,var(--pink));background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 8s ease-in-out infinite alternate;margin-bottom:22px}
@keyframes flow{to{background-position:100% 0}}
.tagline{font-family:var(--serif);font-style:italic;font-size:clamp(1.4rem,3.2vw,2.2rem);margin-bottom:16px}
.hero p.intro{max-width:50ch;color:var(--muted);margin-bottom:32px}
.cta{display:flex;flex-wrap:wrap;gap:14px}
/* ============ 6. ABOUT ============ */
.about-grid{display:grid;gap:18px;grid-template-columns:repeat(12,1fr)}
.card{padding:28px}
.profile{grid-column:span 5;display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.avatar{width:100%;aspect-ratio:1/1;max-height:300px;border-radius:calc(var(--r) - 6px);background:var(--grad);display:grid;place-items:center;color:rgba(255,255,255,.85);position:relative;overflow:hidden}
.avatar::before{content:"";position:absolute;width:70%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.18);top:-20%;right:-15%}
.avatar svg{width:84px;height:84px;position:relative}
.bio{grid-column:span 7}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{padding:6px 14px;border-radius:999px;font-size:.85rem;background:rgba(139,92,246,.12);border:1px solid var(--glass-line)}
.chip.p{background:rgba(236,72,153,.12)}
.mini{grid-column:span 4}
.mini h3,.bio h3{font-size:1rem;margin-bottom:4px}
.bars{display:grid;gap:12px;margin-top:12px}
.bar span{font-size:.82rem;color:var(--muted)}
.bar i{display:block;height:6px;border-radius:6px;background:rgba(139,92,246,.15);margin-top:4px;overflow:hidden}
.bar i b{display:block;height:100%;width:var(--w);background:var(--grad);border-radius:6px}
.quote{grid-column:span 12;text-align:center;padding:44px 28px;background:var(--grad);color:#fff;border:0}
.quote q{font-family:var(--serif);font-style:italic;font-size:clamp(1.4rem,3vw,2.2rem);quotes:none}
@media(max-width:820px){.profile,.bio,.mini{grid-column:span 12}}
/* ============ 7. PROJECTS ============ */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.filter{padding:9px 20px;border-radius:999px;border:1px solid var(--glass-line);background:var(--glass);font-weight:500;font-size:.9rem;transition:.25s}
.filter:hover{border-color:var(--pink)}
.filter.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--glow)}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.project{overflow:hidden;transition:transform .35s,box-shadow .35s;display:flex;flex-direction:column}
.project:hover{transform:translateY(-6px);box-shadow:var(--glow)}
.project.hide{display:none}
.thumb{height:170px;overflow:hidden}
.thumb div{height:100%;display:grid;place-items:center;font-size:2.4rem;color:rgba(255,255,255,.9);transition:transform .6s}
.project:hover .thumb div{transform:scale(1.08)}
.pbody{padding:22px;display:flex;flex-direction:column;gap:8px;flex:1}
.cat{font-size:.78rem;font-weight:600;color:var(--pink-deep)}
[data-theme="dark"] .cat{color:var(--pink-soft)}
.pbody h3{font-size:1.15rem}
.pbody p{font-size:.92rem;color:var(--muted)}
.tools-used{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.tools-used span{font-size:.75rem;padding:3px 10px;border-radius:999px;background:rgba(139,92,246,.12)}
.link{margin-top:auto;font-weight:600;color:var(--purple-deep);align-self:flex-start;border-bottom:2px solid var(--pink-soft);padding-bottom:1px;transition:.2s}
[data-theme="dark"] .link{color:var(--pink-soft)}
.link:hover{border-color:var(--pink)}
/* ============ 8. JOURNAL (timeline) ============ */
.timeline{position:relative;display:grid;gap:22px;padding-left:34px}
.timeline::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--pink),var(--purple),transparent)}
.entry{position:relative;padding:24px 28px;display:grid;gap:6px;transition:transform .3s}
.entry:hover{transform:translateX(6px)}
.entry::before{content:"✦";position:absolute;left:-34px;top:22px;width:18px;height:18px;display:grid;place-items:center;font-size:.8rem;color:var(--pink);background:var(--bg);border-radius:50%}
.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.meta b{color:var(--pink-deep);font-weight:600}
[data-theme="dark"] .meta b{color:var(--pink-soft)}
.entry h3{font-size:1.25rem}
.entry p{color:var(--muted);max-width:62ch}
/* ============ 9. FAVORITES ============ */
.fav-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.fav{padding:26px;position:relative;overflow:hidden;text-align:left;width:100%;transition:transform .3s,box-shadow .3s;background:linear-gradient(145deg,var(--c1),var(--c2));border:1px solid var(--glass-line);border-radius:var(--r)}
.fav:hover{transform:translateY(-5px) rotate(-.4deg);box-shadow:var(--glow)}
.fav h3{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.fav ul{list-style:none;padding:0;display:grid;gap:6px;font-size:.95rem}
.fav li{padding-left:18px;position:relative}
.fav li::before{content:"✦";position:absolute;left:0;color:var(--pink);font-size:.7rem;top:3px}
.fav .hint{margin-top:12px;font-size:.8rem;color:var(--muted);min-height:1.4em;font-family:var(--serif);font-style:italic}
/* ============ 10. CONTACT ============ */
.contact{background:linear-gradient(160deg,var(--pink-deep),var(--purple-deep) 70%,var(--purple-dark));color:#fff;overflow:hidden}
.contact .lead{color:rgba(255,255,255,.8)}
.contact-grid{display:grid;gap:40px;grid-template-columns:1fr 1.1fr;align-items:start}
.form{padding:30px;display:grid;gap:16px;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25)}
label{font-size:.85rem;font-weight:600;display:grid;gap:6px}
input,textarea{padding:13px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:#fff;transition:.2s;resize:vertical}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.55)}
input:focus,textarea:focus{outline:none;border-color:#fff;background:rgba(255,255,255,.22)}
.form .btn{background:#fff;color:var(--purple-deep);justify-self:start}
.form .btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px -10px rgba(0,0,0,.4)}
.status{font-size:.9rem;min-height:1.3em}
.socials{display:flex;gap:10px;margin-top:8px}
.socials a{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.35);transition:.25s}
.socials a:hover{background:#fff;color:var(--purple-deep);transform:translateY(-3px)}
.socials svg{width:19px;height:19px}
@media(max-width:820px){.contact-grid{grid-template-columns:1fr}}
/* ============ 11. FOOTER ============ */
footer{padding:48px 0 36px;font-size:.9rem}
.foot{display:grid;gap:22px;justify-items:center;text-align:center}
.foot .logo{font-size:1.6rem}
.foot nav{display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:center;color:var(--muted)}
.foot nav a:hover{color:var(--pink)}
.foot .socials a{border-color:var(--glass-line);width:38px;height:38px}
.foot .socials a:hover{background:var(--grad);color:#fff}
.copy{color:var(--muted);font-size:.8rem}
.top{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;opacity:0;transform:translateY(12px);pointer-events:none;transition:.3s}
.top.show{opacity:1;transform:none;pointer-events:auto}
/* ============ 12. MOTION + CURSOR ============ */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}
.reveal.in{opacity:1;transform:none}
.cursor{position:fixed;top:0;left:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:1.5px solid var(--pink);pointer-events:none;z-index:100;opacity:0;transition:width .25s,height .25s,margin .25s,background .25s,opacity .3s}
.cursor.big{width:56px;height:56px;margin:-28px 0 0 -28px;background:rgba(236,72,153,.14)}
@media(hover:none),(pointer:coarse){.cursor{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.reveal{opacity:1;transform:none}}
/* ============ 13. HERO BANNER + PARTICLES ============ */
.hero-banner{position:relative;width:100%;overflow:hidden;padding:0}
.hero-banner img{display:block;width:100%;height:auto}
.hero-banner img.banner-bg{position:relative;z-index:0}
.hero-banner img.banner-character{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
#particles-banner{position:absolute;inset:0;z-index:1;pointer-events:none}
#particles-banner canvas{display:block;width:100%!important;height:100%!important}
#particles-js{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
#particles-js canvas{display:block;width:100%!important;height:100%!important}
</style>
</head>

<div class="cursor" id="cursor" aria-hidden="true"></div>

<!-- ============ PARTICLES.JS ============ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
<script>
window.addEventListener("load", function () {
var particlesConfig = {
  particles: {
    number: { value: 80, density: { enable: true, value_area: 800 } },
    color: { value: ["#EC4899", "#8B5CF6", "#F9A8D4"] },
    shape: { type: "circle" },
    opacity: { value: 0.5, random: false },
    size: { value: 3, random: true },
    line_linked: { enable: true, distance: 150, color: "#8B5CF6", opacity: 0.5, width: 1 },
    move: { enable: true, speed: 6, direction: "none", random: false, straight: false, out_mode: "out", bounce: false }
  },
  interactivity: {
    detect_on: "window",
    events: {
      onhover: { enable: true, mode: "repulse" },
      onclick: { enable: true, mode: "push" },
      resize: true
    },
    modes: {
      repulse: { distance: 200, duration: 0.4 },
      push: { particles_nb: 4 }
    }
  },
  retina_detect: true
};
particlesJS("particles-js", particlesConfig);
particlesJS("particles-banner", particlesConfig);
});
</script>

<script>
/* ============ JS: theme, menu, scroll spy, filters, reveal, cursor ============ */
(function(){
  const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
  const root=document.documentElement;

  // Theme toggle (remembered when storage is available)
  try{const t=localStorage.getItem('orly-theme');if(t)root.dataset.theme=t;else if(matchMedia('(prefers-color-scheme: dark)').matches)root.dataset.theme='dark'}catch(e){}
  $('#theme').onclick=()=>{const d=root.dataset.theme==='dark'?'light':'dark';root.dataset.theme=d;try{localStorage.setItem('orly-theme',d)}catch(e){}};

  // Mobile menu
  const links=$('#links'),burger=$('#burger');
  const setMenu=o=>{links.classList.toggle('open',o);burger.setAttribute('aria-expanded',o)};
  burger.onclick=()=>setMenu(!links.classList.contains('open'));
  $$('a',links).forEach(a=>a.onclick=()=>setMenu(false));
  addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});

  // Active nav item on scroll
  const navA=$$('a',links);
  const spy=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting)navA.forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+e.target.id));
  }),{rootMargin:'-45% 0px -50% 0px'});
  $$('main section').forEach(s=>spy.observe(s));

  // Project filters
  $$('.filter').forEach(b=>b.onclick=()=>{
    $$('.filter').forEach(x=>x.classList.toggle('on',x===b));
    $$('.project').forEach(p=>p.classList.toggle('hide',b.dataset.f!=='all'&&p.dataset.c!==b.dataset.f));
  });

  // Favorites: tap to reveal a note
  $$('.fav').forEach(f=>f.onclick=()=>{const h=$('.hint',f);h.textContent=h.textContent?'':f.dataset.note});

  // Reveal on scroll
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
  $$('.reveal').forEach(el=>io.observe(el));

  // Contact form (demo only: connect to your own backend or form service)
  $('#form').onsubmit=e=>{
    e.preventDefault();const f=e.target,s=$('.status',f);
    if(!f.name.value.trim()||!/^\S+@\S+\.\S+$/.test(f.email.value)||!f.message.value.trim()){s.textContent='Please fill in your name, a valid email and a message.';return}
    s.textContent='Thanks! Your message is ready to send once a form service is connected.';f.reset();
  };

  // Back to top
  const top=$('#top');
  addEventListener('scroll',()=>top.classList.toggle('show',scrollY>600),{passive:true});
  top.onclick=()=>scrollTo({top:0,behavior:'smooth'});

  // Custom cursor (desktop only)
  const c=$('#cursor');
  if(matchMedia('(hover:hover) and (pointer:fine)').matches){
    addEventListener('mousemove',e=>{c.style.opacity=1;c.style.transform=`translate(${e.clientX}px,${e.clientY}px)`});
    document.addEventListener('mouseover',e=>c.classList.toggle('big',!!e.target.closest('a,button,input,textarea')));
    document.addEventListener('mouseleave',()=>c.style.opacity=0);
  }
  $('#yr').textContent=new Date().getFullYear();
})();
</script>
</body>
</html>
