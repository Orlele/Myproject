
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact — ORLY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS (same as the rest of the site) ============ */
:root{
  --pink:#EC4899; --pink-soft:#F9A8D4; --pink-deep:#DB2777;
  --purple:#8B5CF6; --purple-deep:#6D28D9; --purple-dark:#2E1065;
  --bg:#FDF4FF; --text:#2E1065; --muted:#6b5a8c;
  --glass:rgba(255,255,255,.62); --glass-line:rgba(139,92,246,.18);
  --shadow:0 10px 30px -12px rgba(109,40,217,.25);
  --grad:linear-gradient(135deg,var(--pink),var(--purple));
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --serif:'Fraunces',Georgia,serif;
  --r:22px; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#11091F; --text:#F5E9FF; --muted:#b9a6d9;
  --glass:rgba(46,16,101,.38); --glass-line:rgba(249,168,212,.16);
  --shadow:0 12px 34px -14px rgba(0,0,0,.7); color-scheme:dark;
}
/* ============ BASE ============ */
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.65;overflow-x:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:background .4s,color .4s}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px;border-radius:8px}
.wrap{width:min(1120px,100% - 40px);margin-inline:auto}
h2{font-size:clamp(1.9rem,4vw,2.8rem);line-height:1.12;letter-spacing:-.02em;margin-bottom:12px}
h2 em{font-family:var(--serif);font-weight:400}
.lead{color:rgba(255,255,255,.8);max-width:52ch;margin-bottom:28px}
.glass{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-line);border-radius:var(--r);box-shadow:var(--shadow)}
.star{color:var(--pink)}
/* ============ NAV ============ */
header{position:fixed;inset:0 0 auto;z-index:50;padding:calc(12px + env(safe-area-inset-top,0px)) 0 0}
.nav{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 10px 24px;border-radius:999px}
.nav img{width:100px;height:auto}
.links{display:flex;gap:4px;list-style:none;padding:0}
.links a{position:relative;display:block;padding:8px 14px;font-size:.92rem;font-weight:500;color:var(--muted);transition:color .2s}
.links a::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:2px;border-radius:2px;background:var(--grad);transform:scaleX(0);transition:transform .3s;box-shadow:0 0 10px var(--pink)}
.links a:hover,.links a.active{color:var(--text)}
.links a.active::after,.links a:hover::after{transform:scaleX(1)}
.tools{display:flex;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass);display:grid;place-items:center;transition:transform .25s,border-color .25s}
.icon-btn:hover{transform:rotate(12deg);border-color:var(--pink)}
.icon-btn svg{width:18px;height:18px}
.burger{display:none}
.moon{display:none}[data-theme="dark"] .moon{display:block}[data-theme="dark"] .sun{display:none}
@media(max-width:820px){
  .burger{display:grid}
  .links{position:absolute;top:calc(100% + 10px);left:0;right:0;flex-direction:column;padding:12px;border-radius:var(--r);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--glass-line);opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;transition:.28s}
  .links.open{opacity:1;transform:none;pointer-events:auto}
  .links a{padding:12px 16px}.links a::after{display:none}
  .nav-wrap{position:relative}
}
/* page background gradient (particles float above it) */
body{background:linear-gradient(160deg,var(--pink-deep),var(--purple-deep) 70%,var(--purple-dark)) fixed}
/* ============ CONTACT ============ */
.contact{position:relative;min-height:100svh;padding:150px 0 90px;color:#fff;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;width:380px;height:380px;right:-80px;top:-80px;background:var(--pink);opacity:.35}
.contact-grid{position:relative;display:grid;gap:40px;grid-template-columns:1fr 1.1fr;align-items:start}
.actions{display:grid;gap:12px;margin-top:6px;max-width:460px}
.cta-main{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:14px 24px;border-radius:999px;background:#fff;color:var(--purple-deep);font-weight:700;font-size:.95rem;text-align:center;box-shadow:0 14px 30px -10px rgba(0,0,0,.4);transition:transform .25s}
.cta-main:hover{transform:translateY(-3px)}
.cta-main svg,.pill svg{width:20px;height:20px;flex:none}
.pills{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pill{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:14px 20px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);font-weight:600;font-size:.95rem;transition:.25s}
.pill:hover{background:#fff;color:var(--purple-deep);transform:translateY(-3px)}
/* with 3 pills, the last one spans the full row so the layout stays symmetrical */
.pill:last-child:nth-child(odd){grid-column:1/-1}
.form{padding:30px;display:grid;gap:16px;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25)}
label{font-size:.85rem;font-weight:600;display:grid;gap:6px}
input,textarea{padding:13px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:#fff;transition:.2s;resize:vertical}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.55)}
input:focus,textarea:focus{outline:none;border-color:#fff;background:rgba(255,255,255,.22)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:999px;border:0;font-weight:600;background:#fff;color:var(--purple-deep);justify-self:start;transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px -10px rgba(0,0,0,.4)}
.status{font-size:.9rem;min-height:1.3em}
@media(max-width:820px){.contact-grid{grid-template-columns:1fr}.actions{max-width:none}}
@media(max-width:380px){.pills{grid-template-columns:1fr}}
/* ============ FOOTER ============ */
footer{padding:36px 0;text-align:center;color:rgba(255,255,255,.8);font-size:.85rem;position:relative}
/* ============ PARTICLES BACKGROUND ============ */
#particles-js{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
#particles-js canvas{display:block;width:100%!important;height:100%!important}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="particles-js" aria-hidden="true"></div>

<header>
  <div class="wrap nav-wrap">
    <div class="nav glass">
      <img src="images (1)/logo 3.0.png" alt="logo">
      <ul class="links" id="links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contactpage.html" class="active">Contact</a></li>
      </ul>
      <div class="tools">
        <button class="icon-btn" id="theme" aria-label="Toggle dark mode">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
        </button>
        <button class="icon-btn burger" id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="links">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </div>
</header>

<main>
<!-- ============ CONTACT ============ -->
<section class="contact" id="contact">
  <div class="orb"></div>
  <div class="wrap contact-grid">
    <div>
      <h2>Say <em>hello</em></h2>
      <p class="lead">Collaborations, questions, or just a kind word. I read everything.</p>
      <div class="actions">
        <!-- Contact Us → opens your location in Google Maps -->
        <a class="cta-main" id="btn-location" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          Contact Us — Find My Location
        </a>
        <div class="pills">
          <a class="pill" id="btn-facebook" href="#" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
            Facebook
          </a>
          <a class="pill" id="btn-instagram" href="#" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg>
            Instagram
          </a>
          <a class="pill" id="btn-gmail" href="#" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 7 9 6 9-6"/></svg>
            Gmail
          </a>
        </div>
      </div>
    </div>
    <form class="glass form" id="form" novalidate>
      <label>Name<input name="name" placeholder="Your name" required autocomplete="name"></label>
      <label>Email<input type="email" name="email" placeholder="you@example.com" required autocomplete="email"></label>
      <label>Message<textarea name="message" rows="4" placeholder="What's on your mind?" required></textarea></label>
      <button class="btn" type="submit">Send Message</button>
      <p class="status" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
</main>

<footer>
  <p>Made with <span class="star">✦</span> and a little bit of pink. © <span id="yr">2026</span> ORLY</p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
<script>
/* =====================================================
   EDIT YOUR DETAILS HERE — everything on the page uses these
   ===================================================== */
const CONFIG = {
  facebook: "https://www.facebook.com/profile.php",      // your Facebook profile / page link
  instagram:"https://www.instagram.com/orleszz/",     // your Instagram profile link
  gmail:    "orly9179@gmail.com",                           // your Gmail address
  location: "JWVM+GHG Manor Circle Building, Araneta Ave, Bacolod, 6100 Negros Occidental",  // address or place name
  coords:   "",   // OPTIONAL but most accurate: your exact pin, e.g. "10.6667,122.9500" (right-click your spot in Google Maps and click the numbers to copy)
  zoom:     18    // how close the map zooms in (1 = world, 21 = closest)
};

(function(){
  const $ = s => document.querySelector(s);
  const root = document.documentElement;

  // Buttons → your accounts
  $('#btn-facebook').href = CONFIG.facebook;
  $('#btn-instagram').href = CONFIG.instagram;
  $('#btn-gmail').href    = 'https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(CONFIG.gmail);
  // Opens Google Maps already zoomed in on your spot (uses exact coordinates if you filled them in)
  $('#btn-location').href = 'https://www.google.com/maps?q=' + encodeURIComponent(CONFIG.coords || CONFIG.location) + '&z=' + CONFIG.zoom;

  // Contact form → opens a Gmail draft addressed to you with their message filled in
  $('#form').onsubmit = e => {
    e.preventDefault();
    const f = e.target, s = $('.status');
    if(!f.name.value.trim() || !/^\S+@\S+\.\S+$/.test(f.email.value) || !f.message.value.trim()){
      s.textContent = 'Please fill in your name, a valid email and a message.'; return;
    }
    const body = f.message.value + '\n\n— ' + f.name.value + ' (' + f.email.value + ')';
    window.open('https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(CONFIG.gmail) +
      '&su=' + encodeURIComponent('Message from ' + f.name.value) + '&body=' + encodeURIComponent(body), '_blank');
    s.textContent = 'Thanks! Your message is ready to send in Gmail.'; f.reset();
  };

  // Theme toggle
  try{const t=localStorage.getItem('orly-theme');if(t)root.dataset.theme=t;else if(matchMedia('(prefers-color-scheme: dark)').matches)root.dataset.theme='dark'}catch(e){}
  $('#theme').onclick = () => {const d=root.dataset.theme==='dark'?'light':'dark';root.dataset.theme=d;try{localStorage.setItem('orly-theme',d)}catch(e){}};

  // Mobile menu
  const links = $('#links'), burger = $('#burger');
  burger.onclick = () => {const o=!links.classList.contains('open');links.classList.toggle('open',o);burger.setAttribute('aria-expanded',o)};

  $('#yr').textContent = new Date().getFullYear();
})();

// Particles background (same as the other pages)
window.addEventListener("load", function () {
  particlesJS("particles-js", {
    particles: {
      number: { value: 80, density: { enable: true, value_area: 800 } },
      color: { value: "#ffffff" },
      shape: { type: "circle" },
      opacity: { value: 0.5, random: false },
      size: { value: 3, random: true },
      line_linked: { enable: true, distance: 150, color: "#ffffff", opacity: 0.4, width: 1 },
      move: { enable: true, speed: 6, direction: "none", random: false, straight: false, out_mode: "out", bounce: false }
    },
    interactivity: {
      detect_on: "window",
      events: { onhover: { enable: true, mode: "repulse" }, onclick: { enable: true, mode: "push" }, resize: true },
      modes: { repulse: { distance: 200, duration: 0.4 }, push: { particles_nb: 4 } }
    },
    retina_detect: true
  });
});
</script>
</body>
</html>
